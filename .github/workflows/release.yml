name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed to find the previous tag for the changelog link below;
          # the default shallow checkout only has the one being released.
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Build plugin
        run: |
          npm install
          npm run build

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # The tag just below this one in version order — not just the
          # highest of the rest, which would be wrong if this tag was
          # (re)created behind ones that already exist, as v0.1.0 once was.
          # The first release has no such tag.
          prev_tag="$(git tag --sort=-version:refname |
            awk -v t="$tag" '$0==t{found=1;next} found{print;exit}')"

          notes_args=()
          if [ -n "$prev_tag" ]; then
            notes_args=(--notes "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${tag}")
          fi

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            "${notes_args[@]}" \
            main.js manifest.json styles.css
